<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Help Desk{% endblock %} · Help Desk Ticket Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('index') }}">🛠️ Help Desk</a>
    <nav>
      <a href="{{ url_for('index') }}">Tickets</a>
      <a href="{{ url_for('estadisticas') }}">Estadísticas</a>
      <a class="btn" href="{{ url_for('nuevo') }}">+ Nuevo ticket</a>
    </nav>
  </header>
  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="aviso {{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
